<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Actualizando QR</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .contenedor {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 25px;
      text-align: center;
      font-size: 26px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .botones {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>Actualizando QR</h1>

    <label for="codigo">Código</label>
    <input
      type="text"
      id="codigo"
      name="codigo"
      placeholder="Ingrese el código"
    >

    <label for="estado">Estado</label>
    <select id="estado" name="estado">
      <option value="disponible">Disponible</option>
      <option value="reservado">Reservado</option>
      <option value="dado">Dado</option>
    </select>

    <div class="botones">
      <button type="button">Consultar</button>
	  <button type="button">Guardar</button>
      
    </div>

  </div>

</body>
</html>
