<body>

<div class="contenedor">

    <h2>🔐 Encriptador</h2>

    <div class="subtitulo">
        Encripta y desencripta tus textos usando una clave
    </div>


    <label for="texto">Texto</label>

    <textarea
        id="texto"
        placeholder="Escribe o pega aquí el texto..."></textarea>


    <label for="clave">Clave</label>

    <input
        type="password"
        id="clave"
        placeholder="Escribe tu clave"
        autocomplete="off">

            class="btn-encriptar"
            onclick="encriptar()">
            🔒 Encriptar
        </button>

            onclick="desencriptar()">
            🔓 Desencriptar
        </button>

    </div>


    <label for="resultado">Resultado</label>

    <textarea
        id="resultado"
        readonly
        placeholder="El resultado aparecerá aquí..."></textarea>


    <button
        class="btn-copiar"
        onclick="copiarResultado()">
        📋 Copiar resultado
    </button>


    <div id="mensaje"></div>

        La información se procesa directamente en tu dispositivo
    </div>

</div>


<script>

const encoder = new TextEncoder();
const decoder = new TextDecoder();


// Convertir ArrayBuffer a Base64
function arrayBufferToBase64(buffer) {

    const bytes = new Uint8Array(buffer);
    let binary = "";

    for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
    }

    return btoa(binary);
}


// Convertir Base64 a ArrayBuffer
function base64ToArrayBuffer(base64) {

    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    return bytes.buffer;
}


// Generar clave AES desde la contraseña
async function generarClave(password, salt) {

    const materialClave = await crypto.subtle.importKey(
        "raw",
        encoder.encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
    );

    return crypto.subtle.deriveKey(
        {
            name: "PBKDF2",
            salt: salt,
            iterations: 200000,
            hash: "SHA-256"
        },
        materialClave,
        {
            name: "AES-GCM",
            length: 256
        },
        false,
        ["encrypt", "decrypt"]
    );
}


// ENCRIPTAR
async function encriptar() {

    const texto = document.getElementById("texto").value;
    const password = document.getElementById("clave").value;
    const resultado = document.getElementById("resultado");
    const mensaje = document.getElementById("mensaje");

    if (!texto.trim()) {
        mensaje.innerHTML = "Escribe un texto primero.";
        return;
    }

    if (!password) {
        mensaje.innerHTML = "Escribe una clave.";
        return;
    }

    try {

        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));

        const claveAES = await generarClave(password, salt);

        const textoEncriptado = await crypto.subtle.encrypt(
            {
                name: "AES-GCM",
                iv: iv
            },
            claveAES,
            encoder.encode(texto)
        );

        const paquete = {
            v: 1,
            salt: arrayBufferToBase64(salt),
            iv: arrayBufferToBase64(iv),
            data: arrayBufferToBase64(textoEncriptado)
        };

        const json = JSON.stringify(paquete);

        resultado.value = btoa(json);

        mensaje.innerHTML = "✓ Texto encriptado correctamente.";

    } catch (error) {

        console.error(error);
        mensaje.innerHTML = "Ocurrió un error al encriptar.";
    }
}


// DESENCRIPTAR
async function desencriptar() {

    const textoEncriptado =
        document.getElementById("texto").value.trim();

    const password =
        document.getElementById("clave").value;

    const resultado =
        document.getElementById("resultado");

    const mensaje =
        document.getElementById("mensaje");

    if (!textoEncriptado) {
        mensaje.innerHTML = "Pega el texto encriptado en el primer campo.";
        return;
    }

    if (!password) {
        mensaje.innerHTML = "Escribe la clave.";
        return;
    }

    try {

        const json = atob(textoEncriptado);

        const paquete = JSON.parse(json);

        const salt = new Uint8Array(
            base64ToArrayBuffer(paquete.salt)
        );

        const iv = new Uint8Array(
            base64ToArrayBuffer(paquete.iv)
        );

        const datos = base64ToArrayBuffer(
            paquete.data
        );

        const claveAES = await generarClave(
            password,
            salt
        );

        const textoOriginal = await crypto.subtle.decrypt(
            {
                name: "AES-GCM",
                iv: iv
            },
            claveAES,
            datos
        );

        resultado.value =
            decoder.decode(textoOriginal);

        mensaje.innerHTML =
            "✓ Texto desencriptado correctamente.";

    } catch (error) {

        console.error(error);

        resultado.value = "";

        mensaje.innerHTML =
            "✗ Clave incorrecta o texto inválido.";
    }
}


// COPIAR RESULTADO
async function copiarResultado() {

    const resultado =
        document.getElementById("resultado").value;

    const mensaje =
        document.getElementById("mensaje");

    if (!resultado) {

        mensaje.innerHTML =
            "No hay ningún resultado para copiar.";

        return;
    }

    try {

        await navigator.clipboard.writeText(resultado);

        mensaje.innerHTML =
            "✓ Resultado copiado.";

    } catch (error) {

        console.error(error);

        mensaje.innerHTML =
            "No se pudo copiar el resultado.";
    }
}

</script>

</body>
