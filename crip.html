<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Encriptador de texto</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f3f5f7;
            margin: 0;
            padding: 18px;
            color: #222;
        }

        .contenedor {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            background: white;
            padding: 22px;
            border-radius: 18px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            margin: 5px 0 25px;
            font-size: 24px;
        }

        .subtitulo {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-top: -15px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: 600;
            font-size: 15px;
        }

        textarea,
        input {
            width: 100%;
            border: 1px solid #d5d9dd;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            background: #fafafa;
            outline: none;
            transition: 0.2s;
        }

        textarea:focus,
        input:focus {
            border-color: #555;
            background: white;
            box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
        }

        textarea {
            min-height: 150px;
            resize: vertical;
            line-height: 1.4;
        }

        #resultado {
            min-height: 150px;
        }

        .botones {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        button {
            flex: 1;
            min-height: 50px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:active {
            transform: scale(0.97);
        }

        .btn-encriptar {
            background: #222;
            color: white;
        }

        .btn-desencriptar {
            background: #e9ecef;
            color: #222;
        }

        .btn-copiar {
            width: 100%;
            margin-top: 12px;
            background: #2f7df6;
            color: white;
        }

        .btn-borrar {
            width: 100%;
            margin-top: 10px;
            background: #f1f1f1;
            color: #444;
        }

        .btn-borrar:hover {
            background: #e5e5e5;
        }

        #mensaje {
            margin-top: 15px;
            min-height: 20px;
            text-align: center;
            font-size: 14px;
            color: #555;
        }

        .pie {
            margin-top: 22px;
            text-align: center;
            font-size: 12px;
            color: #aaa;
        }

        @media (max-width: 480px) {

            body {
                padding: 10px;
            }

            .contenedor {
                margin: 8px auto;
                padding: 18px;
                border-radius: 16px;
            }

            h2 {
                font-size: 22px;
            }

            .botones {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            textarea {
                min-height: 135px;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h2>🔐 Encriptador</h2>

    <div class="subtitulo">
        Encripta tus textos usando una clave
    </div>


    <label for="texto">Texto</label>

    <textarea
        id="texto"
        placeholder=""></textarea>


    <label for="clave">Clave</label>

    <input
        type="password"
        id="clave"
        placeholder="Escribe tu clave"
        autocomplete="off">


    <div class="botones">

        <button
            class="btn-encriptar"
            onclick="encriptar()">
            🔒 Encriptar
        </button>

        <button
            class="btn-desencriptar"
            onclick="desencriptar()">
            🔓 Desencriptar
        </button>

    </div>


    <label for="resultado">Resultado</label>

    <textarea
        id="resultado"
        readonly
        placeholder=""></textarea>


    <button
        class="btn-copiar"
        onclick="copiarResultado()">
        📋 Copiar resultado
    </button>

    <button
        class="btn-borrar"
        onclick="borrarTextos()">
        🗑️ Borrar
    </button>


    <div id="mensaje"></div>

    <!--<div class="pie">
        La información se procesa directamente en tu dispositivo
    </div>-->

</div>


<script>

const encoder = new TextEncoder();
const decoder = new TextDecoder();


// Convertir bytes a Base64URL compacto (sin = al final)
function bytesToBase64Url(bytes) {

    let binary = "";
    const chunkSize = 0x8000;

    for (let i = 0; i < bytes.length; i += chunkSize) {
        const chunk = bytes.subarray(i, Math.min(i + chunkSize, bytes.length));
        binary += String.fromCharCode(...chunk);
    }

    return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/g, "");
}


// Convertir Base64URL a bytes
function base64UrlToBytes(base64url) {

    let base64 = base64url
        .replace(/-/g, "+")
        .replace(/_/g, "/");

    while (base64.length % 4) {
        base64 += "=";
    }

    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    return bytes;
}


// Convertir Base64 clásico a bytes (compatibilidad con la versión anterior)
function base64ToBytesLegacy(base64) {

    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    return bytes;
}


// Comprimir texto cuando el navegador lo soporte
async function comprimirBytes(bytes) {

    if (!("CompressionStream" in window)) {
        return null;
    }

    try {

        const stream = new Blob([bytes])
            .stream()
            .pipeThrough(new CompressionStream("deflate"));

        return new Uint8Array(
            await new Response(stream).arrayBuffer()
        );

    } catch (error) {

        console.warn("No se pudo comprimir. Se continuará sin compresión.", error);
        return null;
    }
}


// Descomprimir texto
async function descomprimirBytes(bytes) {

    if (!("DecompressionStream" in window)) {
        throw new Error("Este navegador no permite descomprimir este texto.");
    }

    const stream = new Blob([bytes])
        .stream()
        .pipeThrough(new DecompressionStream("deflate"));

    return new Uint8Array(
        await new Response(stream).arrayBuffer()
    );
}


// Generar clave AES desde la contraseña
async function generarClave(password, salt) {

    const materialClave = await crypto.subtle.importKey(
        "raw",
        encoder.encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
    );

    return crypto.subtle.deriveKey(
        {
            name: "PBKDF2",
            salt: salt,
            iterations: 200000,
            hash: "SHA-256"
        },
        materialClave,
        {
            name: "AES-GCM",
            length: 256
        },
        false,
        ["encrypt", "decrypt"]
    );
}


// ENCRIPTAR
async function encriptar() {

    const texto = document.getElementById("texto").value;
    const password = document.getElementById("clave").value;
    const resultado = document.getElementById("resultado");
    const mensaje = document.getElementById("mensaje");

    if (!texto.trim()) {
        mensaje.innerHTML = "Escribe un texto primero.";
        return;
    }

    if (!password) {
        mensaje.innerHTML = "Escribe una clave.";
        return;
    }

    try {

        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));

        const claveAES = await generarClave(password, salt);

        const bytesOriginales = encoder.encode(texto);
        const bytesComprimidos = await comprimirBytes(bytesOriginales);

        // 1 = sin compresión
        // 2 = comprimido con deflate
        let tipo = 1;
        let bytesAEncriptar = bytesOriginales;

        if (
            bytesComprimidos &&
            bytesComprimidos.length < bytesOriginales.length
        ) {
            tipo = 2;
            bytesAEncriptar = bytesComprimidos;
        }

        const textoEncriptado = new Uint8Array(
            await crypto.subtle.encrypt(
                {
                    name: "AES-GCM",
                    iv: iv
                },
                claveAES,
                bytesAEncriptar
            )
        );

        // Formato compacto:
        // [1 byte tipo][16 bytes salt][12 bytes IV][datos cifrados + tag GCM]
        const paquete = new Uint8Array(
            1 + salt.length + iv.length + textoEncriptado.length
        );

        paquete[0] = tipo;
        paquete.set(salt, 1);
        paquete.set(iv, 17);
        paquete.set(textoEncriptado, 29);

        resultado.value = bytesToBase64Url(paquete);

        const ahorro = tipo === 2 ? " (comprimido)" : "";
        mensaje.innerHTML =
            "✓ Texto encriptado correctamente" + ahorro + ".";

    } catch (error) {

        console.error(error);
        mensaje.innerHTML = "Ocurrió un error al encriptar.";
    }
}


// DESENCRIPTAR
async function desencriptar() {

    const textoEncriptado =
        document.getElementById("texto").value.trim();

    const password =
        document.getElementById("clave").value;

    const resultado =
        document.getElementById("resultado");

    const mensaje =
        document.getElementById("mensaje");

    if (!textoEncriptado) {
        mensaje.innerHTML = "Pega el texto encriptado en el primer campo.";
        return;
    }

    if (!password) {
        mensaje.innerHTML = "Escribe la clave.";
        return;
    }

    try {

        // Primero intenta leer el nuevo formato compacto.
        let esFormatoCompacto = false;
        let paquete;

        try {
            paquete = base64UrlToBytes(textoEncriptado);
            esFormatoCompacto =
                paquete.length >= 46 &&
                (paquete[0] === 1 || paquete[0] === 2);
        } catch (_) {
            esFormatoCompacto = false;
        }

        if (esFormatoCompacto) {

            const tipo = paquete[0];
            const salt = paquete.slice(1, 17);
            const iv = paquete.slice(17, 29);
            const datos = paquete.slice(29);

            const claveAES = await generarClave(password, salt);

            let bytesOriginales = new Uint8Array(
                await crypto.subtle.decrypt(
                    {
                        name: "AES-GCM",
                        iv: iv
                    },
                    claveAES,
                    datos
                )
            );

            if (tipo === 2) {
                bytesOriginales = await descomprimirBytes(bytesOriginales);
            }

            resultado.value = decoder.decode(bytesOriginales);

        } else {

            // Compatibilidad con textos creados con la versión anterior.
            const json = atob(textoEncriptado);
            const paqueteAnterior = JSON.parse(json);

            const salt = base64ToBytesLegacy(paqueteAnterior.salt);
            const iv = base64ToBytesLegacy(paqueteAnterior.iv);
            const datos = base64ToBytesLegacy(paqueteAnterior.data);

            const claveAES = await generarClave(password, salt);

            const textoOriginal = await crypto.subtle.decrypt(
                {
                    name: "AES-GCM",
                    iv: iv
                },
                claveAES,
                datos
            );

            resultado.value = decoder.decode(textoOriginal);
        }

        mensaje.innerHTML =
            "✓ Texto desencriptado correctamente.";

    } catch (error) {

        console.error(error);
        resultado.value = "";

        mensaje.innerHTML =
            "✗ Clave incorrecta o texto inválido.";
    }
}


// COPIAR RESULTADO
async function copiarResultado() {

    const resultado =
        document.getElementById("resultado").value;

    const mensaje =
        document.getElementById("mensaje");

    if (!resultado) {

        mensaje.innerHTML =
            "No hay ningún resultado para copiar.";

        return;
    }

    try {

        await navigator.clipboard.writeText(resultado);

        mensaje.innerHTML =
            "✓ Resultado copiado.";

    } catch (error) {

        console.error(error);

        mensaje.innerHTML =
            "No se pudo copiar el resultado.";
    }
}


// BORRAR LOS DOS TEXTAREA
function borrarTextos() {

    document.getElementById("texto").value = "";
    document.getElementById("resultado").value = "";
    document.getElementById("mensaje").innerHTML = "";

    document.getElementById("texto").focus();
}

</script>

</body>
</html>
